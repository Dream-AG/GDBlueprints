name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python addons/GDBlueprints/tools/fetch_ci_engine.py
      - name: Regression, export and exact package checks
        shell: bash
        run: python addons/GDBlueprints/tools/validate_release.py --godot "$GODOT" --templates "$GODOT_TEMPLATES" --logs test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: test-results/
